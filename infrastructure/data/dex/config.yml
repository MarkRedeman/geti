# The base path of dex and the external name of the OpenID Connect service.
#
# This is the canonical URL that all clients MUST use to refer to dex. If a
# path is provided, dex's HTTP service will listen at a non-root URL.
issuer: https://geti.localhost/dex
#issuer: {{ .Env.DEX_DOMAIN }}

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db
    #file: ":memory:"

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true
  responseTypes:  ["code", "token", "id_token"]
  passwordConnector: local

staticClients:
- id: "web_ui"
  redirectURIs:
    - '/callback'
  name: 'IMPT'
  public: true
# http://geti.localhost/dex/auth/regular_users
# ?client_id=web_ui
# &redirect_uri=%2Fcallback
# &response_type=code
# &scope=openid+profile+groups+email+offline_access
# &state=252b25730b174d7d9361e90a6a97fc6e
# &code_challenge=aYyYX5VGXeqLHKNzH3Kr5C1H3cYea4VDVAQtKzPOHs8
# &code_challenge_method=S256
# &response_mode=query

enablePasswordDB: true

logger:
  level: "debug"

staticPasswords:
- email: "admin@geti.local"
  # bcrypt hash of the string "AdminPassword123!"
  hash: "$2y$10$3rYLiop3QvFD8hsOGAa6M.uogYRHBoh7LZzakIC4rE8uh3LECt1Ci"
  username: "admin"
  userID: "admin@geti.local"


frontend:
  dir: /web
  extra:
    isSMTPDefined: "false"
    # isSMTPDefined: {{ .Values.isSMTPDefined }}

