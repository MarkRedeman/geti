  # Web UI
  # 
  web:
    image: ${REGISTRY-ghcr.io/geti}/web_ui:${TAG-main}
    build:
      context: ./web_ui
      <<: *proxies
      additional_contexts:
        - nginx_image=docker-image://${NGINX_IMAGE}
        - node_image=docker-image://${NODE_IMAGE}
        - docs_context=./docs 
        - api_context=./interactive_ai/services/api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geti-web.rule=(Host(`geti.localhost`) && !(PathPrefix(`/dex`)) && !(PathPrefix(`/api`))) || Host(`web.geti.localhost`)"
      - "traefik.http.routers.geti-web-feature-flags.rule=Host(`geti.localhost`) && Path(`/api/v1/feature_flags`)"
      - "traefik.http.routers.geti-web-feature-flags.priority=200"
      - "traefik.http.routers.geti-web-feature-flags.service=geti-web"
      - "traefik.http.routers.geti-web.priority=1"
      - "traefik.http.services.geti-web.loadbalancer.server.port=3000"


  # Infrastructure
  #
  # traefik
  reverse-proxy:
    image: traefik:v3.4
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/tls.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--api=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik-tls.yml:/etc/traefik/tls.yml:ro
      - ./infrastructure/data/auth_proxy/certs/tls.crt:/certs/tls.crt:ro
      - ./infrastructure/data/auth_proxy/certs/tls.key:/certs/tls.key:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.middlewares.geti-auth.forwardauth.address=http://platform_auth_proxy:7002/api/v1/auth"
      - "traefik.http.middlewares.geti-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.geti-auth.forwardauth.authResponseHeaders=x-auth-request-access-token"
    restart: unless-stopped

  # https://geek-cookbook.funkypenguin.co.nz/docker-swarm/authelia/
  # https://www.authelia.com/integration/proxies/traefik/
  authelia:
    image: 'authelia/authelia'
    restart: 'unless-stopped'
    volumes:
      - '${PWD}/infrastructure/data/authelia/config:/config'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.geti.localhost`)"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"



      # "traefik.enable": 'true'
      # "traefik.http.routers.authelia.rule": 'Host(`auth.geti.localhost`)'
      # "traefik.http.routers.authelia.entryPoints": 'https'
      # "traefik.http.routers.authelia.tls": 'true'
      # "traefik.http.middlewares.authelia.forwardAuth.address": 'http://authelia:9091/api/authz/forward-auth'
      ## The following commented line is for configuring the Authelia URL in the proxy. We strongly suggest this is
      ## configured in the Session Cookies section of the Authelia configuration.
      # traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.example.com%2F'
      # traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: 'true'
      # traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: 'Remote-User,Remote-Groups,Remote-Email,Remote-Name'

    # dex:
    # https://geek-cookbook.funkypenguin.co.nz/docker-swarm/traefik-forward-auth/dex-static/
  dex:
    image: dexidp/dex
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - '${PWD}/infrastructure/data/dex/config.yml:/config.yml:ro'
      - '${PWD}/infrastructure/data/dex/dex.db:/var/dex/dex.db'
      - '${PWD}/web_ui/dex_templates:/web'
    command: ['dex', 'serve','/config.yml']
    #command: ['/bin/sh']
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dex.rule=(Host(`geti.localhost`) && PathPrefix(`/dex`))"
      - "traefik.http.services.dex.loadbalancer.server.port=5556"
    environment:
      DEX_DOMAIN: "dex.geti.localhost"
    restart: unless-stopped


  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094,PLAINTEXT_HOST://:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9095
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      ALLOW_PLAINTEXT_LISTENER: yes
    ports:
      - 9095:9095
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      start_period: 15s
      interval: 10s
      retries: 5
      timeout: 10s
    restart: always

  init-kafka-topics:
    image: apache/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
      - for topic in annotation_scenes_to_revisit configuration_changes dataset_counters_updated dataset_updated training_successful media_deletions media_preprocessing media_uploads new_annotation_scene predictions_and_metadata_created project_creations project_deletions project_updates thumbnail_video_missing model_activated model_reverted flyte_event job_step_details job_update on_job_cancelled on_job_failed on_job_finished project_notifications credits_lease; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1; done
    restart: "no"

  s3:
    image: chrislusf/seaweedfs:3.69
    restart: always
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - s3_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fileservice.rule=Host(`geti.localhost`) && PathPrefix(`/api/v1/fileservice/`)"
      - "traefik.http.routers.fileservice.priority=60"
      - "traefik.http.routers.fileservice.middlewares=fileservice-strip@docker"
      - "traefik.http.middlewares.fileservice-strip.stripprefix.prefixes=/api/v1/fileservice"
      - "traefik.http.services.fileservice.loadbalancer.server.port=8333"

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "Geti Local"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
    ports:
      - "389:389"
    restart: always

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
    restart: always

  spicedb:
    image: authzed/spicedb:v1.34.0
    command: serve --grpc-preshared-key "${SPICEDB_TOKEN}"
    restart: always
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-v", "-addr=localhost:50051"]
      start_period: 15s
      interval: 10s
      retries: 5
      timeout: 10s

  db:
    image: postgres:14.13
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=${DB_NAME} --username=${DB_USER}"]
      start_period: 20s
      interval: 10s
      retries: 5
      timeout: 10s
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE_NAME}
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGODB_ROOT_USERNAME}", "--password", "${MONGODB_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      start_period: 20s
      interval: 10s
      retries: 5
      timeout: 10s
    restart: always
    volumes:
      - mongodb_data:/data/db

volumes:
  s3_data:
  postgres_data:
  mongodb_data:
  user_directory_logs:

networks:
  default:
    name: geti
