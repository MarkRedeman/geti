x-proxies: &proxies
  args:
    - HTTP_PROXY=${HTTP_PROXY}
    - HTTPS_PROXY=${HTTPS_PROXY}
    - NO_PROXY=${NO_PROXY}
    - http_proxy=${http_proxy}
    - https_proxy=${https_proxy}
    - no_proxy=${no_proxy}

services:
  # Build services
  #
  debian:
    image: ${REGISTRY-ghcr.io/geti}/debian:${TAG-main}
    build:
      dockerfile_inline: |
        FROM debian AS debian
        LABEL release=1

        RUN apt update \
            && apt -y install \
                ca-certificates \
                curl=7.88.* \
                wget=1.21.* \
                netcat-traditional=1.10-* \
                gpg \
            && apt clean all \
            && rm -rf /var/cache/apt/*
      <<: *proxies
      additional_contexts:
        #- debian=docker-image://public.ecr.aws/debian/debian:12.8-slim
        - debian=docker-image://gcr.io/distroless/static-debian12:nonroot


  otx:
    image: ${REGISTRY-ghcr.io/geti}/otx2:${TAG-main}
    build:
      dockerfile_inline: |
        FROM debian AS otx

        ARG OTX_RELEASE_TAG

        WORKDIR /app

        RUN apt-get update && \
            apt-get install -y git \
            && apt clean all \
            && rm -rf /var/cache/apt/*

        RUN git clone --branch ${OTX_RELEASE_TAG} --single-branch https://github.com/open-edge-platform/training_extensions.git

        RUN cp -r /app/training_extensions/src/otx/tools/templates /model_templates
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
        - http_proxy=${http_proxy}
        - https_proxy=${https_proxy}
        - no_proxy=${no_proxy}
        - OTX_RELEASE_TAG=${OTX_RELEASE_TAG}
      additional_contexts:
        - debian=docker-image://public.ecr.aws/debian/debian:12.8-slim
        

  # Platform services
  # 
  platform_account:
    image: ${REGISTRY-ghcr.io/geti}/platform_account:${TAG-main}
    build:
      context: ./platform/services/account
      <<: *proxies
      additional_contexts:
        - credit_system=./libs/grpc_interfaces/src/grpc_interfaces/credit_system/go
        - account_service_grpc=./libs/grpc_interfaces/src/grpc_interfaces/account_service/go

  platform_auth_proxy:
    image: ${REGISTRY-ghcr.io/geti}/platform_auth_proxy:${TAG-main}
    build:
      context: ./platform/services/auth_proxy
      <<: *proxies
      additional_contexts:
        - account_service_client=./libs/grpc_interfaces/src/grpc_interfaces/account_service/go
    environment:
      ACCOUNT_SERVICE_ADDRESS: "platform_account"
      JWT_CERTIFICATE_PRIVATE_KEY_PATH: "/tls.key"
      JWT_CERTIFICATE_PUBLIC_KEY_PATH: "/tls.crt"
      #JWKS_UPDATE_TIME: {{ .Values.certificate.jwksUpdateTime }} # 1s
      #JWKS_ENTRY_EXPIRATION: {{ .Values.certificate.jwksEntryExpiration }} # 15m
      #LOGGING_CONFIG_DIR: {{ .Values.global.logging_config_dir }}
      #ISS_INTERNAL: ...
      #AUD_INTERNAL: ...
      #ISS_EXTERNAL: ...
      #AUD_EXTERNAL: ...
      #REQUIRED_ROLES: ...
      #HTTP_SERVER_PORT: 7002

  platform_credit:
    image: ${REGISTRY-ghcr.io/geti}/platform_credit:${TAG-main}
    build:
      context: ./platform/services/credit
      <<: *proxies
      additional_contexts:
        - libs=./libs 

  platform_notifier:
    image: ${REGISTRY-ghcr.io/geti}/platform_notifier:${TAG-main}
    build:
      context: ./platform/services/notifier
      <<: *proxies
      additional_contexts:
        - libs=./libs

  platform_observability:
    image: ${REGISTRY-ghcr.io/geti}/platform_observability:${TAG-main}
    build:
      context: ./platform/services/observability
      <<: *proxies
      additional_contexts:
        - libs=./libs

  platform_onboarding:
    image: ${REGISTRY-ghcr.io/geti}/platform_onboarding:${TAG-main}
    build:
      context: ./platform/services/onboarding
      <<: *proxies
      additional_contexts:
        - libs=./libs

  platform_initial_user:
    image: ${REGISTRY-ghcr.io/geti}/platform_initial_user:${TAG-main}
    build:
      context: ./platform/services/initial_user
      <<: *proxies
      additional_contexts:
        - common_libs=./libs
        - platform_libs=./platform/libs

  platform_user_directory:
    image: ${REGISTRY-ghcr.io/geti}/platform_user_directory:${TAG-main}
    build:
      context: ./platform/services/user_directory
      <<: *proxies
      additional_contexts:
        - libs=./libs
        - platform_libs=./platform/libs

  # IAI Services
  # 
  interactive_ai_auto_train:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/auto_train:${TAG-main}
    build:
      context: ./interactive_ai/services/auto_train
      <<: *proxies
      additional_contexts:
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/

  interactive_ai_dataset_import_export:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/dataset_import_export:${TAG-main}
    build:
      context: ./interactive_ai/services/dataset_ie
      <<: *proxies
      additional_contexts:
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/

  interactive_ai_director:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/director:${TAG-main}
    build:
      context: ./interactive_ai/services/director
      <<: *proxies
      additional_contexts:
        - schemas=./interactive_ai/services/api
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/
        - supported_models=./interactive_ai/supported_models/

  interactive_ai_inference_gateway:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/inference_gateway:${TAG-main}
    build:
      context: ./interactive_ai/services/inference_gateway
      <<: *proxies
      additional_contexts:
        - iai_core=./interactive_ai/libs/iai_core_go/
        - modelmesh=./libs/grpc_interfaces/src/grpc_interfaces/model_mesh/go/pb
        - modelregistration=./libs/grpc_interfaces/src/grpc_interfaces/model_registration/go/pb
        - predict=./libs/grpc_interfaces/src/grpc_interfaces/predict/go/pb

  interactive_ai_jobs:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/jobs:${TAG-main}
    build:
      context: ./interactive_ai/services/jobs
      <<: *proxies
      additional_contexts:
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/

  interactive_ai_media:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/media:${TAG-main}
    build:
      context: ./interactive_ai/services/media
      <<: *proxies
      additional_contexts:
        - iai_core=./interactive_ai/libs/iai_core_go/

  interactive_ai_mlflow_geti_store:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/mlflow_geti_store:${TAG-main}
    build:
      <<: *proxies
      context: ./interactive_ai/services/mlflow_geti_store

  interactive_ai_model_registration:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/model_registration:${TAG-main}
    build:
      context: ./interactive_ai/services/model_registration
      <<: *proxies
      additional_contexts:
        - libs=./libs

  interactive_ai_project_import_export:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/project_import_export:${TAG-main}
    build:
      context: ./interactive_ai/services/project_ie
      <<: *proxies
      additional_contexts:
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/

  interactive_ai_resource:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/resource:${TAG-main}
    build:
      context: ./interactive_ai/services/resource
      <<: *proxies
      additional_contexts:
        - schemas=./interactive_ai/services/api
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/
        - media_utils=./interactive_ai/libs/media_utils

  interactive_ai_visual_prompt:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/visual_prompt:${TAG-main}
    build:
      context: ./interactive_ai/services/visual_prompt
      <<: *proxies
      additional_contexts:
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/
        - media_utils=./interactive_ai/libs/media_utils

  # IAI Workflows
  # 
  interactive_ai_workflows_dataset_import_export:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/workflows_dataset_import_export:${TAG-main}
    build:
      context: ./interactive_ai/workflows/geti_domain/dataset_ie
      <<: *proxies
      additional_contexts:
        - common=./interactive_ai/workflows/geti_domain/common
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/
        - media_utils=./interactive_ai/libs/media_utils

  interactive_ai_workflows_model_test:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/workflows_model_test:${TAG-main}
    build:
      context: ./interactive_ai/workflows/geti_domain/model_test
      <<: *proxies
      additional_contexts:
        - common=./interactive_ai/workflows/geti_domain/common
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/
        - media_utils=./interactive_ai/libs/media_utils

  interactive_ai_workflows_project_import_export:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/workflows_project_import_export:${TAG-main}
    build:
      context: ./interactive_ai/workflows/geti_domain/project_ie
      <<: *proxies
      additional_contexts:
        - common=./interactive_ai/workflows/geti_domain/common
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/
        - media_utils=./interactive_ai/libs/media_utils
        - data_migration=./interactive_ai/data_migration

  interactive_ai_workflows_optimize:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/workflows_optimize:${TAG-main}
    build:
      context: ./interactive_ai/workflows/geti_domain/optimize
      <<: *proxies
      additional_contexts:
        - common=./interactive_ai/workflows/geti_domain/common
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/
        - media_utils=./interactive_ai/libs/media_utils

  interactive_ai_workflows_train:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/workflows_train:${TAG-main}
    build:
      context: ./interactive_ai/workflows/geti_domain/train
      <<: *proxies
      additional_contexts:
        - common=./interactive_ai/workflows/geti_domain/common
        - libs=./libs
        - iai_core=./interactive_ai/libs/iai_core_py/
        - media_utils=./interactive_ai/libs/media_utils

  interactive_ai_workflows_otx_v2_gpu:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/otx_v2_gpu:${TAG-main}
    build:
      context: ./interactive_ai/workflows/otx_domain/trainer/otx_v2
      dockerfile: ./gpu/Dockerfile
      <<: *proxies
      additional_contexts:
        - libs=./libs

  interactive_ai_workflows_otx_v2_xpu:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/otx_v2_xpu:${TAG-main}
    build:
      context: ./interactive_ai/workflows/otx_domain/trainer/otx_v2
      dockerfile: ./xpu/Dockerfile
      <<: *proxies
      additional_contexts:
        - libs=./libs

  # Web UI
  # 
  web:
    image: ${REGISTRY-ghcr.io/geti}/web_ui:${TAG-main}
    build:
      context: ./web_ui
      <<: *proxies
      additional_contexts:
        - nginx_image=docker-image://${NGINX_IMAGE}
        - node_image=docker-image://${NODE_IMAGE}
        - docs_context=./docs 
        - api_context=./interactive_ai/services/api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geti-web.rule=(Host(`geti.localhost`) && !(PathPrefix(`/dex`))) || Host(`web.geti.localhost`)"
      - "traefik.http.services.geti-web.loadbalancer.server.port=3000"


  # Infrastructure
  #
  # traefik
  reverse-proxy:
    image: traefik:v3.4
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api=true"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      - "traefik.http.routers.traefik.service=api@internal"
    restart: unless-stopped

  # https://geek-cookbook.funkypenguin.co.nz/docker-swarm/authelia/
  # https://www.authelia.com/integration/proxies/traefik/
  authelia:
    image: 'authelia/authelia'
    restart: 'unless-stopped'
    volumes:
      - '${PWD}/infrastructure/data/authelia/config:/config'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.geti.localhost`)"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"



      # "traefik.enable": 'true'
      # "traefik.http.routers.authelia.rule": 'Host(`auth.geti.localhost`)'
      # "traefik.http.routers.authelia.entryPoints": 'https'
      # "traefik.http.routers.authelia.tls": 'true'
      # "traefik.http.middlewares.authelia.forwardAuth.address": 'http://authelia:9091/api/authz/forward-auth'
      ## The following commented line is for configuring the Authelia URL in the proxy. We strongly suggest this is
      ## configured in the Session Cookies section of the Authelia configuration.
      # traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.example.com%2F'
      # traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: 'true'
      # traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: 'Remote-User,Remote-Groups,Remote-Email,Remote-Name'

    # dex:
    # https://geek-cookbook.funkypenguin.co.nz/docker-swarm/traefik-forward-auth/dex-static/
  dex:
    image: dexidp/dex
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - '${PWD}/infrastructure/data/dex/config.yml:/config.yml:ro'
      - '${PWD}/infrastructure/data/dex/dex.db:/var/dex/dex.db'
      - '${PWD}/web_ui/dex_templates:/web'
    command: ['dex', 'serve','/config.yml']
    #command: ['/bin/sh']
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dex.rule=(Host(`geti.localhost`) && PathPrefix(`/dex`))"
      - "traefik.http.services.dex.loadbalancer.server.port=5556"
    environment:
      DEX_DOMAIN: "dex.geti.localhost"
    restart: unless-stopped


  kafka:
    image: bitnami/kafka:3.7.1-debian-12-r7
    environment:
      KAFKA_ENABLE_KRAFT: yes
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094,PLAINTEXT_HOST://:9095
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_BROKER_ID: 1
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9095
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: yes
      BITNAMI_DEBUG: yes
    ports:
      - 9095:9095
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--version"]
      start_period: 15s
      interval: 10s
      retries: 5
      timeout: 10s
    restart: always

  s3:
    image: chrislusf/seaweedfs:3.69
    restart: always
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - s3_data:/data

  spicedb:
    image: authzed/spicedb:v1.34.0
    command: serve --grpc-preshared-key "${SPICEDB_TOKEN}"
    restart: always
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-v", "-addr=localhost:50051"]
      start_period: 15s
      interval: 10s
      retries: 5
      timeout: 10s

  db:
    image: postgres:14.13
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=${DB_NAME} --username=${DB_USER}"]
      start_period: 20s
      interval: 10s
      retries: 5
      timeout: 10s
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE_NAME}
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGODB_ROOT_USERNAME}", "--password", "${MONGODB_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      start_period: 20s
      interval: 10s
      retries: 5
      timeout: 10s
    restart: always
    volumes:
      - mongodb_data:/data/db

volumes:
  s3_data:
  postgres_data:
  mongodb_data:

networks:
  default:
    name: geti
