x-proxies: &proxies
  args:
    - HTTP_PROXY=${HTTP_PROXY}
    - HTTPS_PROXY=${HTTPS_PROXY}
    - NO_PROXY=${NO_PROXY}
    - http_proxy=${http_proxy}
    - https_proxy=${https_proxy}
    - no_proxy=${no_proxy}

x-iai-runtime-env: &iai-runtime-env
  DATABASE_ADDRESS: ${DATABASE_ADDRESS}
  DATABASE_USERNAME: ${DATABASE_USERNAME}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD}
  MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME}
  KAFKA_ADDRESS: ${KAFKA_ADDRESS}
  KAFKA_USERNAME: ${KAFKA_USERNAME}
  KAFKA_PASSWORD: ${KAFKA_PASSWORD}
  KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
  SPICEDB_ADDRESS: ${SPICEDB_ADDRESS}
  SPICEDB_TOKEN: ${SPICEDB_TOKEN}
  SPICEDB_CREDENTIALS: token
  S3_CREDENTIALS_PROVIDER: local
  S3_HOST: s3:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_PRESIGNED_URL_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_PRESIGNED_URL_SECRET_KEY: ${S3_SECRET_KEY}
  BUCKET_NAME_IMAGES: images
  BUCKET_NAME_VIDEOS: videos
  BUCKET_NAME_THUMBNAILS: thumbnails
  BUCKET_NAME_TENSORS: tensors
  BUCKET_NAME_MODELS: models
  BUCKET_NAME_TEMPORARYFILES: temporaryfiles
  BUCKET_NAME_RESULTMEDIA: resultmedia
  BUCKET_NAME_CODEDEPLOYMENTS: codedeployments
  BUCKET_NAME_MLFLOWEXPERIMENTS: mlflowexperiments
  BUCKET_NAME_PRETRAINEDWEIGHTS: pretrainedweights
  BUCKET_NAME_VPSREFERENCEFEATURES: vpsreferencefeatures
  FEATURE_FLAG_OBJECT_STORAGE_OP: "true"
  FEATURE_FLAGS_HEADER_VALUE: ""
  FEATURE_FLAGS_URL: ""

services:
  # Build services
  #
  debian:
    image: ${REGISTRY-ghcr.io/geti}/debian:${TAG-main}
    build:
      dockerfile_inline: |
        FROM debian AS debian
        LABEL release=1

        RUN apt update \
            && apt -y install \
                ca-certificates \
                curl=7.88.* \
                wget=1.21.* \
                netcat-traditional=1.10-* \
                gpg \
            && apt clean all \
            && rm -rf /var/cache/apt/*
      <<: *proxies
      additional_contexts:
        #- debian=docker-image://public.ecr.aws/debian/debian:12.8-slim
        - debian=docker-image://gcr.io/distroless/static-debian12:nonroot


  otx:
    image: geti-otx2-local:${TAG-main}
    build:
      dockerfile_inline: |
        FROM debian AS otx

        ARG OTX_RELEASE_TAG

        WORKDIR /app

        RUN apt-get update && \
            apt-get install -y git \
            && apt clean all \
            && rm -rf /var/cache/apt/*

        RUN git clone --branch ${OTX_RELEASE_TAG} --single-branch https://github.com/open-edge-platform/training_extensions.git

        RUN cp -r /app/training_extensions/src/otx/tools/templates /model_templates
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
        - http_proxy=${http_proxy}
        - https_proxy=${https_proxy}
        - no_proxy=${no_proxy}
        - OTX_RELEASE_TAG=${OTX_RELEASE_TAG}
      additional_contexts:
        - debian=docker-image://public.ecr.aws/debian/debian:12.8-slim
        

  # Platform services
  # 
  platform_account:
    image: ${REGISTRY-ghcr.io/geti}/platform_account:${TAG-main}
    build:
      context: ./platform/services/account
      <<: *proxies
      additional_contexts:
        - credit_system=./libs/grpc_interfaces/src/grpc_interfaces/credit_system/go
        - account_service_grpc=./libs/grpc_interfaces/src/grpc_interfaces/account_service/go
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.platform-account.rule=Host(`geti.localhost`) && (PathRegexp(`^/api/v[0-9]+/organizations/?$`) || PathRegexp(`^/api/v[0-9]+/organizations/.*/workspaces/?$`) || PathRegexp(`^/api/v[0-9]+/organizations/.*/(users|quotas|credits|activeUser)(/.*)?$`) || PathRegexp(`^/api/v[0-9]+/logout/?$`) || PathRegexp(`^/api/v[0-9]+/profile/?$`) || PathRegexp(`^/api/v[0-9]+/personal_access_tokens(/.*)?$`))"
      - "traefik.http.routers.platform-account.priority=90"
      - "traefik.http.services.platform-account.loadbalancer.server.port=5002"
      - "traefik.http.routers.platform-account.middlewares=geti-auth@docker"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PORT: 5432
      POSTGRES_DB_NAME: ${DB_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SPICEDB_ADDRESS: ${SPICEDB_ADDRESS}
      SPICEDB_TOKEN: ${SPICEDB_TOKEN}
      KAFKA_ADDRESS: ${KAFKA_ADDRESS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      GETI_NOTIFICATION_TOPIC: ${GETI_NOTIFICATION_TOPIC}
      LOGGING_CONFIG_DIR: /
      USERS_PER_ORG_LIMIT: 300
      FEATURE_FLAG_MANAGE_USERS_ROLES: "true"
      FEATURE_FLAG_MANAGE_USERS: "true"
      FEATURE_FLAG_REQ_ACCESS: "false"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
      kafka:
        condition: service_healthy
      spicedb:
        condition: service_healthy

  platform_auth_proxy:
    image: ${REGISTRY-ghcr.io/geti}/platform_auth_proxy:${TAG-main}
    build:
      context: ./platform/services/auth_proxy
      <<: *proxies
      additional_contexts:
        - account_service_client=./libs/grpc_interfaces/src/grpc_interfaces/account_service/go
    environment:
      ACCOUNT_SERVICE_HOST: "platform_account"
      ACCOUNT_SERVICE_PORT: "5001"
      ACCOUNT_SERVICE_ADDRESS: "platform_account:5001"
      JWT_CERTIFICATE_PRIVATE_KEY_PATH: "/etc/geti-jwt-secret/tls.key"
      JWT_CERTIFICATE_PUBLIC_KEY_PATH: "/etc/geti-jwt-secret/tls.crt"
      HTTP_SERVER_PORT: "7002"
      UNAUTHORIZED_URLS: "/api/v1/profile,/api/v1/logout,/api/v1/onboarding/user,/api/v1/feature_flags"
      #JWKS_UPDATE_TIME: {{ .Values.certificate.jwksUpdateTime }} # 1s
      #JWKS_ENTRY_EXPIRATION: {{ .Values.certificate.jwksEntryExpiration }} # 15m
      LOGGING_CONFIG_DIR: /
      #ISS_INTERNAL: ...
      #AUD_INTERNAL: ...
      #ISS_EXTERNAL: ...
      #AUD_EXTERNAL: ...
      #REQUIRED_ROLES: ...
    volumes:
      - ./infrastructure/data/auth_proxy/certs:/etc/geti-jwt-secret:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.platform-auth-proxy.rule=Host(`geti.localhost`) && PathRegexp(`^/api/v[0-9]+/set_cookie/?$`)"
      - "traefik.http.routers.platform-auth-proxy.priority=100"
      - "traefik.http.services.platform-auth-proxy.loadbalancer.server.port=7002"
    depends_on:
      platform_account:
        condition: service_started

  platform_credit:
    image: ${REGISTRY-ghcr.io/geti}/platform_credit:${TAG-main}
    build:
      context: ./platform/services/credit
      <<: *proxies
      additional_contexts:
        - libs=./libs 
    environment:
      POSTGRES_HOST: db
      POSTGRES_RO_HOST: db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PORT: 5432
      POSTGRES_DB_NAME: creditsystem
      POSTGRES_SSLMODE: disable
      KAFKA_ADDRESS: ${KAFKA_ADDRESS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      KAFKA_SASL_MECHANISM: PLAIN
      ACCOUNT_SERVICE_HOST: platform_account
      ACCOUNT_SERVICE_PORT: 5001
      GRPC_SERVICE_PORT: 5556
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      platform_account:
        condition: service_started

  platform_notifier:
    image: ${REGISTRY-ghcr.io/geti}/platform_notifier:${TAG-main}
    build:
      context: ./platform/services/notifier
      <<: *proxies
      additional_contexts:
        - libs=./libs
    environment:
      KAFKA_ADDRESS: ${KAFKA_ADDRESS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      GETI_NOTIFICATION_TOPIC: ${GETI_NOTIFICATION_TOPIC}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_LOGIN: ${SMTP_LOGIN}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      USE_START_TLS: "false"
    depends_on:
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started

  platform_observability:
    image: ${REGISTRY-ghcr.io/geti}/platform_observability:${TAG-main}
    build:
      context: ./platform/services/observability
      <<: *proxies
      additional_contexts:
        - libs=./libs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.platform-observability.rule=Host(`geti.localhost`) && PathPrefix(`/api/v1/logs`)"
      - "traefik.http.routers.platform-observability.priority=55"
      - "traefik.http.services.platform-observability.loadbalancer.server.port=9000"
  platform_onboarding:
    image: ${REGISTRY-ghcr.io/geti}/platform_onboarding:${TAG-main}
    build:
      context: ./platform/services/onboarding
      <<: *proxies
      additional_contexts:
        - libs=./libs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.platform-onboarding.rule=Host(`geti.localhost`) && (PathRegexp(`^/api/v[0-9]+/onboarding/user/?$`) || PathRegexp(`^/api/v[0-9]+/admin/onboarding/tokens/?$`))"
      - "traefik.http.routers.platform-onboarding.priority=88"
      - "traefik.http.services.platform-onboarding.loadbalancer.server.port=9000"
    environment:
      ACCOUNT_SERVICE_HOST: platform_account
      ACCOUNT_SERVICE_PORT: 5001
      CREDITS_SERVICE: platform_credit:5556
      FEATURE_FLAG_CREDIT_SYSTEM: "false"
      FEATURE_FLAG_FREE_TIER: "false"
      FEATURE_FLAG_SAAS_REQUIRE_INVITATION_LINK: "false"
      FEATURE_FLAG_REQ_ACCESS: "false"
      MARKETING_PLATFORM_URL: ""
      MARKETING_PLATFORM_FORM_NAME: ""
      MARKETING_PLATFORM_SITE_ID: ""
    depends_on:
      platform_account:
        condition: service_started
      platform_credit:
        condition: service_started

  platform_initial_user:
    image: ${REGISTRY-ghcr.io/geti}/platform_initial_user:${TAG-main}
    build:
      context: ./platform/services/initial_user
      <<: *proxies
      additional_contexts:
        - common_libs=./libs
        - platform_libs=./platform/libs
    command:
      - python
      - create_initial_user.py
    environment:
      INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD}
      DEX_STATIC_USER_ID: ${DEX_STATIC_USER_ID}
      LDAP_HOST: ${LDAP_HOST}
      LDAP_PORT: ${LDAP_PORT}
      LDAP_ADMIN_USER: ${LDAP_ADMIN_USER}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      SPICEDB_ADDRESS: ${SPICEDB_ADDRESS}
      SPICEDB_TOKEN: ${SPICEDB_TOKEN}
      SPICEDB_CREDENTIALS: token
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DB_NAME}
      SPICEDB_POSTGRES_USER: ${DB_USER}
      SPICEDB_POSTGRES_PASSWORD: ${DB_PASSWORD}
      ACCOUNT_SERVICE_HOST: platform_account
      ACCOUNT_SERVICE_PORT: 5001
      FEATURE_FLAG_WORKSPACE_ACTIONS: "false"
      LOGGING_CONFIG_DIR: /
    depends_on:
      db:
        condition: service_healthy
      spicedb:
        condition: service_healthy
      platform_account:
        condition: service_started
      openldap:
        condition: service_started
    restart: "no"

  platform_user_directory:
    image: ${REGISTRY-ghcr.io/geti}/platform_user_directory:${TAG-main}
    build:
      context: ./platform/services/user_directory
      <<: *proxies
      additional_contexts:
        - libs=./libs
        - platform_libs=./platform/libs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.platform-user-directory.rule=Host(`geti.localhost`) && (PathRegexp(`^/api/v[0-9]+/users/reset_password/?$`) || PathRegexp(`^/api/v[0-9]+/organizations/.*/users/create/?$`) || PathRegexp(`^/api/v[0-9]+/users/.*/update_password/?$`) || PathRegexp(`^/api/v[0-9]+/users/confirm_registration/?$`) || PathRegexp(`^/api/v[0-9]+/organizations/.*/users/invitations/?$`) || PathPrefix(`/confirm-action/registration/reset-password`))"
      - "traefik.http.routers.platform-user-directory.priority=95"
      - "traefik.http.services.platform-user-directory.loadbalancer.server.port=9000"
    environment:
      ACCOUNT_SERVICE_HOST: platform_account
      ACCOUNT_SERVICE_PORT: 5001
      LDAP_HOST: ${LDAP_HOST}
      LDAP_PORT: ${LDAP_PORT}
      LDAP_ADMIN_USER: ${LDAP_ADMIN_USER}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      SPICEDB_ADDRESS: ${SPICEDB_ADDRESS}
      SPICEDB_TOKEN: ${SPICEDB_TOKEN}
      SPICEDB_CREDENTIALS: token
      KAFKA_ADDRESS: ${KAFKA_ADDRESS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      GETI_NOTIFICATION_TOPIC: ${GETI_NOTIFICATION_TOPIC}
      LOGS_DIR: /logs
      LOGGING_CONFIG_DIR: /
      USE_KUBECONFIG: "true"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_LOGIN: ${SMTP_LOGIN}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      INVITATION_FROM_ADDRESS: no-reply@geti.intel.com
      INVITATION_FROM_NAME: Intel Geti
      # Compose-mode secrets / config-map fallbacks (see service_connection/k8s_client/{secrets,config_maps}.py)
      # JWT key used to sign invitation and password-reset tokens (secret name: impt-jwt-config, key: key)
      GETI_SECRET_IMPT_JWT_CONFIG_KEY: ${GETI_JWT_SECRET_KEY}
      # impt-configuration CM fields consumed by invite_user and password_reset endpoints
      GETI_CM_IMPT_CONFIGURATION_INVITE_USER_EXPIRATION: "43200"
      GETI_CM_IMPT_CONFIGURATION_PASSWORD_RESET_EXPIRATION: "15"
    depends_on:
      openldap:
        condition: service_started
      kafka:
        condition: service_healthy
      spicedb:
        condition: service_healthy
    volumes:
      - user_directory_logs:/logs

  # IAI Services
  # 
  interactive_ai_auto_train:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/api:${TAG-main}
    build:
      context: ./interactive_ai/services
      dockerfile: Dockerfile.api
      <<: *proxies
      additional_contexts:
        libs: ./libs
        iai_core: ./interactive_ai/libs/iai_core_py/
        media_utils: ./interactive_ai/libs/media_utils
        supported_models: ./interactive_ai/supported_models/
        schemas: ./interactive_ai/services/api
        otx: service:otx
    working_dir: /interactive_ai/services/auto_train
    command: ["python", "main.py"]
    environment:
      <<: *iai-runtime-env
      PATH: /interactive_ai/services/auto_train/.venv/bin:$PATH
      PYTHONPATH: /interactive_ai/services/auto_train
      JOB_SERVICE_ADDRESS: interactive_ai_jobs:50051
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-kafka-topics:
        condition: service_completed_successfully

  interactive_ai_dataset_import_export:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/api:${TAG-main}
    working_dir: /interactive_ai/services/dataset_ie/communication/endpoints
    command: ["python", "main.py"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.interactive-ai-dataset-ie.rule=Host(`geti.localhost`) && (PathRegexp(`^/api/v[0-9]+/.*/datasets/uploads/resumable(/.*)?$`) || PathRegexp(`^/api/v[0-9]+/.*/(prepare-for-import|import-from-dataset|prepare-for-export)(/.*)?$`) || PathRegexp(`^/api/v[0-9]+/.*/datasets/.*/exports(/.*)?$`) || PathRegexp(`^/api/v[0-9]+/.*/datasets/.*:prepare-for-export.*$`) || PathRegexp(`^/api/v[0-9]+/.*/datasets:prepare-for-import.*$`) || PathRegexp(`^/api/v[0-9]+/.*/projects/[^/]+/datasets:prepare-for-import.*$`) || PathRegexp(`^/api/v[0-9]+/.*/projects/[^/]+:import-from-dataset.*$`) || PathRegexp(`^/api/v[0-9]+/.*/workspaces/[^/]+/projects:import-from-dataset.*$`))"
      - "traefik.http.routers.interactive-ai-dataset-ie.priority=75"
      - "traefik.http.routers.interactive-ai-dataset-ie.middlewares=geti-auth@docker"
      - "traefik.http.services.interactive-ai-dataset-ie.loadbalancer.server.port=8000"
    environment:
      <<: *iai-runtime-env
      PATH: /interactive_ai/services/dataset_ie/.venv/bin:$PATH
      PYTHONPATH: /interactive_ai/services/dataset_ie
      JOB_SERVICE_ADDRESS: interactive_ai_jobs:50051
    depends_on:
      migration_job:
        condition: service_completed_successfully
      init-kafka-topics:
        condition: service_completed_successfully

  interactive_ai_director:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/api:${TAG-main}
    working_dir: /interactive_ai/services/director/app/communication
    command: ["python", "main.py"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.interactive-ai-director.rule=Host(`geti.localhost`) && (PathRegexp(`^/api/v[0-9]+/organizations/.*/status/?$`) || PathRegexp(`^/api/v[0-9]+/.*/organizations/.*/status/?$`) || PathRegexp(`^/api/v[0-9]+/organizations/.*/workspaces/.*/projects/.*/status/?$`) || PathRegexp(`^/api/v[0-9]+/.*/projects/.*/status/?$`) || PathRegexp(`^/api/v[0-9]+/organizations/.*/workspaces/.*/(predictions|train|optimize|settings|datasets/active|configuration|tests)(/.*)?$`) || PathRegexp(`^/api/v[0-9]+/.*/workspaces/.*/(predictions|train|optimize|settings|datasets/active|configuration|tests)(/.*)?$`) || PathRegexp(`^/api/v[0-9]+/organizations/.*/workspaces/.*/projects/.*:train$`) || PathRegexp(`^/api/v[0-9]+/.*/projects/.*:train$`) || PathRegexp(`^/api/v[0-9]+/organizations/.*/workspaces/.*/projects/.*/models/.*:optimize$`) || PathRegexp(`^/api/v[0-9]+/.*/models/.*:optimize$`) || PathRegexp(`^/api/v[0-9]+/organizations/.*/workspaces/.*/projects/.*/supported_algorithms/?$`) || PathRegexp(`^/api/v[0-9]+/.*/projects/.*/supported_algorithms/?$`) || PathRegexp(`^/api/v[0-9]+/organizations/.*/workspaces/.*/projects/.*/project_configuration/?$`) || PathRegexp(`^/api/v[0-9]+/.*/projects/.*/project_configuration/?$`) || PathRegexp(`^/api/v[0-9]+/organizations/.*/workspaces/.*/projects/.*/training_configuration/?$`) || PathRegexp(`^/api/v[0-9]+/.*/projects/.*/training_configuration/?$`))"
      - "traefik.http.routers.interactive-ai-director.priority=65"
      - "traefik.http.routers.interactive-ai-director.middlewares=geti-auth@docker"
      - "traefik.http.services.interactive-ai-director.loadbalancer.server.port=4999"
    environment:
      <<: *iai-runtime-env
      PATH: /interactive_ai/services/director/.venv/bin:$PATH
      PYTHONPATH: /interactive_ai/services/director:/interactive_ai/services/director/app
      JOB_SERVICE_ADDRESS: interactive_ai_jobs:50051
    depends_on:
      migration_job:
        condition: service_completed_successfully
      init-kafka-topics:
        condition: service_completed_successfully

  interactive_ai_inference_gateway:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/inference_gateway:${TAG-main}
    build:
      context: ./interactive_ai/services/inference_gateway
      <<: *proxies
      additional_contexts:
        - iai_core=./interactive_ai/libs/iai_core_go/
        - modelmesh=./libs/grpc_interfaces/src/grpc_interfaces/model_mesh/go/pb
        - modelregistration=./libs/grpc_interfaces/src/grpc_interfaces/model_registration/go/pb
        - predict=./libs/grpc_interfaces/src/grpc_interfaces/predict/go/pb
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.interactive-ai-inference-gateway.rule=Host(`geti.localhost`) && (PathRegexp(`^/api/v[0-9]+/.*/pipelines/.*/status/?$`) || PathRegexp(`^/api/v[0-9]+/.*/pipelines/.*:(predict|explain|batch_predict|batch_explain|batch_predict_stream)$`) || PathRegexp(`^/api/v[0-9]+/.*/models/.*/status/?$`) || PathRegexp(`^/api/v[0-9]+/.*/models/.*:(predict|explain|batch_predict|batch_explain|batch_predict_stream)$`))"
      - "traefik.http.routers.interactive-ai-inference-gateway.priority=80"
      - "traefik.http.routers.interactive-ai-inference-gateway.middlewares=geti-auth@docker"
      - "traefik.http.services.interactive-ai-inference-gateway.loadbalancer.server.port=7000"
    environment:
      <<: *iai-runtime-env
      OVMS_SERVICE: ovms
      OVMS_PORT: 9000
      DIRECTOR_MS_SERVICE: interactive_ai_director
      DIRECTOR_MS_ADDRESS: http://interactive_ai_director:4999
    depends_on:
      migration_job:
        condition: service_completed_successfully
      ovms:
        condition: service_started
      interactive_ai_model_registration:
        condition: service_started

  interactive_ai_jobs:
    image: ${REGISTRY-ghcr.io/geti}/interactive_ai/api:${TAG-main}
    working_dir: /interactive_ai/services/jobs
    command: ["python", "microservice/rest/main.py"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.interactive-ai-jobs.rule=Host(`geti.localhost`) && (PathRegexp(`^/api/v[0-9]+/organizations/.*/workspaces/.*/jobs(/.*)?$`) || PathRegexp(`^/api/v[0-9]+/.*/workspaces/.*/jobs(/.*)?$`))"
      - "traefik.http.routers.interactive-ai-jobs.priority=70"
      - "traefik.http.routers.interactive-ai-jobs.middlewares=geti-auth@docker"
      - "traefik.http.services.interactive-ai-jobs.loadbalancer.server.port=8000"
    environment:
      <<: *iai-runtime-env
      PATH: /interactive_ai/services/jobs/.venv/bin:$PATH
      PYTHONPATH: /interactive_ai/services/jobs
